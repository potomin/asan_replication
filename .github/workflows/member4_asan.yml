name: Member 4 ASan 12-run demonstration

on:
  workflow_dispatch:
  push:
    paths:
      - 'asan_heap_demo.cpp'
      - 'member4_run_demo.sh'
      - '.github/workflows/member4_asan.yml'

jobs:
  run-asan-demo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Compile and run 12 ASan tests
        run: |
          bash member4_run_demo.sh
          {
            echo
            echo 'Execution location: GitHub Actions hosted Ubuntu runner (NOT local WSL).'
            echo "Workflow run ID: ${GITHUB_RUN_ID}"
            echo "Workflow SHA: ${GITHUB_SHA}"
          } >> demo_results/environment.md
          sed -i 's/in WSL\/Linux/on GitHub Actions Linux runner/g' demo_results/expected_vs_actual.md
      - name: Upload raw outputs and actual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member4-asan-test-results
          path: demo_results/
          if-no-files-found: warn
